<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>한글 · Learn Korean</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--surface:#141a2e;--surface2:#1c2440;--primary:#5b8cff;--primary-glow:rgba(91,140,255,0.4);--accent:#ff6b9d;--gold:#ffc94d;--green:#3ddc97;--red:#ff5e7a;--text:#eef2ff;--muted:#7a85a8;--border:rgba(255,255,255,0.07)}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom) + 80px);user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(91,140,255,0.08),transparent 70%);top:-150px;right:-150px;pointer-events:none;z-index:0}
header{padding:calc(env(safe-area-inset-top) + 1rem) 1.2rem 0.6rem;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:0.6rem}
.brand-logo{font-family:'Black Han Sans',sans-serif;font-size:1.6rem;color:var(--primary)}
.brand-text{font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)}
.lang-switch{display:flex;gap:0.3rem;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:0.25rem}
.lang-btn{background:none;border:none;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:700;font-size:0.7rem;padding:0.35rem 0.6rem;border-radius:20px;cursor:pointer;transition:all 0.2s}
.lang-btn.active{background:var(--primary);color:#fff}
.goal-section{padding:0.5rem 1.2rem 1rem;position:relative;z-index:1}
.goal-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:24px;padding:1.4rem;display:flex;align-items:center;gap:1.4rem}
.ring{position:relative;width:80px;height:80px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:'Black Han Sans',sans-serif;font-size:1.3rem;color:var(--text);line-height:1}
.ring-label{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em}
.goal-info{flex:1}
.goal-title{font-weight:700;font-size:1.05rem;margin-bottom:0.2rem}
.goal-sub{font-size:0.8rem;color:var(--muted);line-height:1.4}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,14,26,0.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:0.6rem 0.5rem calc(env(safe-area-inset-bottom) + 0.6rem)}
.tab{background:none;border:none;color:var(--muted);font-family:'Outfit',sans-serif;font-size:0.65rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:0.25rem;cursor:pointer;transition:color 0.2s;flex:1}
.tab .ic{font-size:1.3rem}
.tab.active{color:var(--primary)}
main{position:relative;z-index:1;padding:0 1.2rem;max-width:560px;margin:0 auto}
.page{display:none;animation:fade 0.35s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-weight:700;font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin:1.4rem 0 0.8rem}
.lesson-grid{display:flex;flex-direction:column;gap:0.8rem}
.lesson-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.2rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.lesson-card:active{transform:scale(0.98)}
.lesson-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lc,var(--primary))}
.lc-emoji{font-size:1.8rem;width:52px;height:52px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--lcbg,rgba(91,140,255,0.12))}
.lc-info{flex:1;min-width:0}
.lc-title{font-weight:700;font-size:1rem}
.lc-sub{font-size:0.78rem;color:var(--muted);margin-top:0.1rem}
.lc-progress{margin-top:0.5rem;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.lc-fill{height:100%;background:var(--lc,var(--primary));border-radius:2px;transition:width 0.5s}
.lc-arrow{color:var(--muted);font-size:1.1rem}
.study-wrap{padding-top:1rem}
.study-top{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
.study-back{background:var(--surface);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.study-bar{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.study-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;transition:width 0.4s}
.study-count{font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--muted)}
.word-card{background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:28px;padding:2.5rem 1.5rem;text-align:center;margin-bottom:1.2rem;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.audio-btn{position:absolute;top:1.2rem;right:1.2rem;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:rgba(91,140,255,0.15);color:var(--primary);font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.audio-btn:active{transform:scale(0.9);background:rgba(91,140,255,0.3)}
.audio-btn.playing{animation:pulse 0.6s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.word-hangul{font-family:'Black Han Sans',sans-serif;font-size:3.5rem;color:var(--text);line-height:1.1;margin-bottom:0.6rem}
.word-hangul.small{font-size:2.2rem}
.word-roman{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--primary);margin-bottom:0.8rem}
.word-english{font-size:1.4rem;font-weight:600;color:var(--green)}
.tap-hint{font-size:0.75rem;color:var(--muted);margin-top:1rem}
.options{display:flex;flex-direction:column;gap:0.7rem;margin-bottom:1rem}
.option{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1rem 1.2rem;font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:500;color:var(--text);cursor:pointer;text-align:left;transition:all 0.15s}
.option:active{transform:scale(0.99)}
.option.correct{border-color:var(--green);background:rgba(61,220,151,0.12);color:var(--green)}
.option.wrong{border-color:var(--red);background:rgba(255,94,122,0.12);color:var(--red)}
.option:disabled{cursor:default}
.recall-row{display:flex;gap:0.7rem;margin-bottom:1rem}
.btn{font-family:'Outfit',sans-serif;font-weight:700;font-size:0.95rem;padding:1rem;border-radius:16px;border:none;cursor:pointer;transition:all 0.2s;flex:1}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 20px var(--primary-glow)}
.btn-hard{background:rgba(255,94,122,0.15);color:var(--red);border:1px solid rgba(255,94,122,0.3)}
.btn-easy{background:rgba(61,220,151,0.15);color:var(--green);border:1px solid rgba(61,220,151,0.3)}
.btn-full{width:100%;margin-bottom:0.7rem}
.sentence-target{background:var(--surface);border:1px dashed var(--border);border-radius:16px;padding:1.2rem;min-height:70px;margin-bottom:0.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center}
.sentence-english{text-align:center;font-size:1.1rem;color:var(--muted);margin-bottom:1rem}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:0.6rem 1rem;font-family:'Black Han Sans',sans-serif;font-size:1.1rem;cursor:pointer;transition:all 0.15s;color:var(--text)}
.chip:active{transform:scale(0.95)}
.chip.placed{opacity:0.3;pointer-events:none}
.chip-bank{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-bottom:1.2rem}
.slot{background:rgba(91,140,255,0.12);border:1px solid var(--primary);border-radius:12px;padding:0.6rem 1rem;font-family:'Black Han Sans',sans-serif;font-size:1.1rem;cursor:pointer}
.feedback{border-radius:16px;padding:1rem 1.2rem;margin-bottom:1rem;font-size:0.92rem;line-height:1.5;display:none}
.feedback.show{display:block;animation:fade 0.3s ease}
.feedback.good{background:rgba(61,220,151,0.1);border:1px solid rgba(61,220,151,0.25);color:var(--green)}
.feedback.bad{background:rgba(255,94,122,0.1);border:1px solid rgba(255,94,122,0.25);color:#ff9db0}
.complete{text-align:center;padding:3rem 1rem}
.complete-emoji{font-size:4rem;margin-bottom:1rem}
.complete-title{font-family:'Black Han Sans',sans-serif;font-size:1.8rem;color:var(--primary);margin-bottom:0.5rem}
.complete-stats{display:flex;gap:1rem;justify-content:center;margin:1.5rem 0}
.cstat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem 1.4rem}
.cstat-num{font-family:'Black Han Sans',sans-serif;font-size:1.8rem;color:var(--gold)}
.cstat-label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem}
.stat-c{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.3rem;text-align:center}
.stat-c .n{font-family:'Black Han Sans',sans-serif;font-size:2rem;color:var(--scc,var(--primary))}
.stat-c .l{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-top:0.2rem}
.word-list{display:flex;flex-direction:column;gap:0.5rem}
.wl-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0.8rem 1rem;display:flex;align-items:center;gap:0.8rem}
.wl-hangul{font-family:'Black Han Sans',sans-serif;font-size:1.3rem;color:var(--primary);min-width:60px}
.wl-mid{flex:1}
.wl-eng{font-weight:600;font-size:0.9rem}
.wl-rom{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--muted)}
.wl-audio{background:none;border:none;color:var(--primary);font-size:1.1rem;cursor:pointer}
.toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,120px);background:var(--surface2);border:1px solid var(--green);border-radius:14px;padding:0.8rem 1.4rem;font-size:0.9rem;color:var(--green);z-index:999;opacity:0;transition:all 0.3s;font-weight:600;box-shadow:0 4px 30px rgba(0,0,0,0.4);white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:rgba(91,140,255,0.3);border-radius:3px}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="brand-logo">한글</span><span class="brand-text" id="brand-text">Learn Korean</span></div>
  <div class="lang-switch">
    <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="lang-ru" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" id="lang-uz" onclick="setLang('uz')">UZ</button>
  </div>
</header>

<main>
<div class="page active" id="page-home">
  <div class="goal-section">
    <div class="goal-card">
      <div class="ring">
        <svg width="80" height="80">
          <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
          <circle id="ring-fill" cx="40" cy="40" r="34" fill="none" stroke="url(#grad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
          <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5b8cff"/><stop offset="100%" stop-color="#ff6b9d"/></linearGradient></defs>
        </svg>
        <div class="ring-text"><span class="ring-num" id="ring-num">0</span><span class="ring-label" id="ring-label">today</span></div>
      </div>
      <div class="goal-info">
        <div class="goal-title" id="goal-title">Today's Progress 🎯</div>
        <div class="goal-sub" id="goal-sub"></div>
      </div>
    </div>
  </div>
  <div id="audio-note" style="display:none;background:rgba(255,201,77,0.08);border:1px solid rgba(255,201,77,0.3);border-radius:16px;padding:1rem;margin-bottom:0.5rem">
    <div style="font-weight:700;color:var(--gold);font-size:0.85rem;margin-bottom:0.3rem" id="an-title">🔊 Turn on Korean audio</div>
    <div style="font-size:0.78rem;color:var(--muted);line-height:1.5" id="an-body"></div>
    <button id="an-btn" onclick="this.parentElement.style.display='none';localStorage.setItem('kr_audionote','1')" style="margin-top:0.6rem;background:rgba(255,201,77,0.15);border:1px solid rgba(255,201,77,0.3);color:var(--gold);border-radius:10px;padding:0.4rem 0.9rem;font-size:0.75rem;font-weight:600;cursor:pointer">OK</button>
  </div>
  <div class="section-title" id="st-lessons">Choose a Lesson</div>
  <div class="lesson-grid" id="lesson-grid"></div>
</div>

<div class="page" id="page-study"><div class="study-wrap" id="study-wrap"></div></div>

<div class="page" id="page-review">
  <div id="review-home"></div>
  <div class="study-wrap" id="review-wrap" style="display:none"></div>
</div>

<div class="page" id="page-progress">
  <div class="section-title" id="st-stats" style="margin-top:1.5rem">Your Stats</div>
  <div class="stat-cards">
    <div class="stat-c" style="--scc:var(--primary)"><span class="n" id="ps-learned">0</span><span class="l" id="psl-learned">Learned</span></div>
    <div class="stat-c" style="--scc:var(--gold)"><span class="n" id="ps-streak">0</span><span class="l" id="psl-streak">Streak</span></div>
    <div class="stat-c" style="--scc:var(--green)"><span class="n" id="ps-mastered">0</span><span class="l" id="psl-mastered">Mastered</span></div>
    <div class="stat-c" style="--scc:var(--accent)"><span class="n" id="ps-total">0</span><span class="l" id="psl-xp">Total XP</span></div>
  </div>
  <div class="section-title" id="st-learning">Words You're Learning</div>
  <div class="word-list" id="word-list"></div>
</div>
</main>

<div class="tabbar">
  <button class="tab active" onclick="nav('home',this)"><span class="ic">🏠</span><span id="tab-learn">Learn</span></button>
  <button class="tab" onclick="nav('review',this)"><span class="ic">🔄</span><span id="tab-review">Review</span></button>
  <button class="tab" onclick="nav('progress',this)"><span class="ic">📊</span><span id="tab-stats">Stats</span></button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ UI TRANSLATIONS ============
const UI = {
  en:{brand:'Learn Korean',goalTitle:"Today's Progress 🎯",today:'today',lessons:'Choose a Lesson',stats:'Your Stats',learning:"Words You're Learning",learn:'Learn',statsTab:'Stats',learned:'Learned',streak:'Streak',mastered:'Mastered',xp:'Total XP',
    gotit:'Got it →',stillLearning:'Still Learning',gotItCheck:'Got It ✓',whatMeans:'What does this mean?',correct:'✓ Correct! Nice one.',notQuite:'Not quite — it means',seeSoon:". You'll see it again soon.",remember:'🤔 Do you remember? Tap to reveal',forgot:'Forgot 😕',knewIt:'Knew it ✓',tapFlip:'🔊 Tap to hear it again',build:'Build',tapOrder:'Tap words below in order...',checkAns:'Check Answer',perfect:'✓ Perfect! Correct word order.',close:'Close! Correct:',sessionDone:'Session Complete!',greatWork:'Great work on',correctLabel:'Correct',newWords:'New Words',streakLabel:'Streak',studyAgain:'Study Again 🔄',backHome:'Back Home',startLesson:'Start a lesson to begin learning words! 🌱',

    gotit:'Понятно →',stillLearning:'Ещё учу',gotItCheck:'Знаю ✓',whatMeans:'Что это значит?',correct:'✓ Верно! Отлично.',notQuite:'Не совсем — это значит',seeSoon:'. Скоро повторим.',remember:'🤔 Помните? Нажмите, чтобы открыть',forgot:'Забыл 😕',knewIt:'Знал ✓',tapFlip:'🔊 Нажмите, чтобы услышать снова',build:'Составьте',tapOrder:'Нажимайте слова по порядку...',checkAns:'Проверить',perfect:'✓ Отлично! Верный порядок слов.',close:'Почти! Верно:',sessionDone:'Урок завершён!',greatWork:'Отличная работа:',correctLabel:'Верно',newWords:'Новые слова',streakLabel:'Серия',studyAgain:'Ещё раз 🔄',backHome:'На главную',startLesson:'Начните урок, чтобы учить слова! 🌱',

let LANG = localStorage.getItem('kr_lang') || 'en';
function t(){return UI[LANG];}

// ============ DATA — words with en/ru/uz meanings ============

if(state.lastDay!==today){const y=new Date(Date.now()-86400000).toDateString();if(state.lastDay===y)state.streak++;else if(state.lastDay!=='')state.streak=1;else state.streak=1;state.todayCount=0;state.lastDay=today;saveAll();}
function saveAll(){save('kr_words',state.words);save('kr_streak',state.streak);save('kr_today',state.todayCount);save('kr_lastday',state.lastDay);save('kr_xp',state.totalXP);}

function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=0.85;const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('ko'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}

// meaning of a word in current language
function m(w){return w[LANG]||w.en;}
function lt(obj){return obj[LANG]||obj.en;}

function setLang(lang){
  LANG=lang;localStorage.setItem('kr_lang',lang);
  ['en','ru','uz'].forEach(l=>document.getElementById('lang-'+l).classList.toggle('active',l===lang));
  applyUI();renderHome();
}

function applyUI(){
  const x=t();
  document.getElementById('brand-text').textContent=x.brand;
  document.getElementById('goal-title').textContent=x.goalTitle;
  document.getElementById('ring-label').textContent=x.today;
  document.getElementById('st-lessons').textContent=x.lessons;
  document.getElementById('st-stats').textContent=x.stats;
  document.getElementById('st-learning').textContent=x.learning;
  document.getElementById('tab-learn').textContent=x.learn;
  document.getElementById('tab-review').textContent=x.review;
  document.getElementById('tab-stats').textContent=x.statsTab;
  document.getElementById('psl-learned').textContent=x.learned;
  document.getElementById('psl-streak').textContent=x.streak;
  document.getElementById('psl-mastered').textContent=x.mastered;
  document.getElementById('psl-xp').textContent=x.xp;
  document.getElementById('an-title').textContent=x.anTitle;
  document.getElementById('an-body').textContent=x.anBody;
}

function renderHome(){
  if(!localStorage.getItem('kr_audionote'))document.getElementById('audio-note').style.display='block';
  const x=t();
  document.getElementById('ring-num').textContent=state.todayCount;
  const pct=Math.min(state.todayCount/20,1);
  document.getElementById('ring-fill').style.strokeDashoffset=213.6*(1-pct);
  const sub=document.getElementById('goal-sub');
  if(state.todayCount===0)sub.textContent=x.goal0;
  else if(state.todayCount<10)sub.textContent=state.todayCount+' '+x.goalLow;
  else sub.textContent=state.todayCount+' '+x.goalHigh;
  document.getElementById('lesson-grid').innerHTML=lessons.map(l=>{
    const learned=l.words.filter(w=>state.words[w.k]&&state.words[w.k].box>=1).length;
    const p=Math.round(learned/l.words.length*100);
    return '<div class="lesson-card" style="--lc:'+l.color+';--lcbg:'+l.bg+'" onclick="startLesson(\''+l.id+'\')"><div class="lc-emoji" style="background:'+l.bg+'">'+l.emoji+'</div><div class="lc-info"><div class="lc-title">'+lt(l.title)+'</div><div class="lc-sub">'+learned+'/'+l.words.length+' '+x.learned.toLowerCase()+'</div><div class="lc-progress"><div class="lc-fill" style="width:'+p+'%"></div></div></div><div class="lc-arrow">›</div></div>';
  }).join('');
}

let session=null;
function startLesson(id){
  const lesson=lessons.find(l=>l.id===id);
  let queue=[];
  lesson.words.forEach(w=>{queue.push({type:'learn',word:w,lesson:lesson});queue.push({type:'choose',word:w,lesson:lesson});queue.push({type:'recall',word:w,lesson:lesson});});
  const sent=sentences[Math.floor(Math.random()*sentences.length)];
  queue.push({type:'sentence',sentence:sent});
  session={lesson:lesson,queue:queue,idx:0,correct:0,learnedThisSession:new Set()};
  nav('study',null,true);renderStep();
}

function renderStep(){
  const wrap=document.getElementById('study-wrap');
  if(session.idx>=session.queue.length){renderComplete();return;}
  const step=session.queue[session.idx];
  const progress=Math.round(session.idx/session.queue.length*100);
  let inner='<div class="study-top"><button class="study-back" onclick="nav(\'home\',document.querySelectorAll(\'.tab\')[0])">✕</button><div class="study-bar"><div class="study-bar-fill" style="width:'+progress+'%"></div></div><span class="study-count">'+(session.idx+1)+'/'+session.queue.length+'</span></div>';
  if(step.type==='learn')inner+=learnStep(step);
  else if(step.type==='choose')inner+=chooseStep(step);
  else if(step.type==='recall')inner+=recallStep(step);
  else if(step.type==='sentence')inner+=sentenceStep(step);
  wrap.innerHTML=inner;
  if(step.type==='learn')setTimeout(()=>speak(step.word.k),350);
}

function esc(s){return (''+s).replace(/'/g,"\\'");}

function learnStep(step){const w=step.word;const x=t();return '<div class="word-card"><button class="audio-btn" onclick="speak(\''+w.k+'\');this.classList.add(\'playing\');setTimeout(()=>this.classList.remove(\'playing\'),700)">🔊</button><div class="word-hangul">'+w.k+'</div><div class="word-roman">'+w.r+'</div><div class="word-english">'+m(w)+'</div><div class="tap-hint">'+x.tapFlip+'</div></div><button class="btn btn-primary btn-full" onclick="advance()">'+x.gotit+'</button>';}

function chooseStep(step){
  const w=step.word;const x=t();
  const allM=lessons.flatMap(l=>l.words.map(z=>m(z)));
  let opts=[m(w)];const others=allM.filter(e=>e!==m(w)).sort(()=>Math.random()-0.5);opts.push(...others.slice(0,3));opts=opts.sort(()=>Math.random()-0.5);
  return '<div class="word-card" style="min-height:160px"><button class="audio-btn" onclick="speak(\''+w.k+'\')">🔊</button><div class="word-hangul small">'+w.k+'</div><div class="word-roman">'+w.r+'</div></div><div style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:0.8rem">'+x.whatMeans+'</div><div class="options">'+opts.map(o=>'<button class="option" onclick="checkChoice(this,\''+esc(o)+'\',\''+esc(m(w))+'\',\''+w.k+'\')">'+o+'</button>').join('')+'</div><div class="feedback" id="fb"></div>';
}

function checkChoice(el,chosen,correct,hangul){
  const x=t();
  document.querySelectorAll('.option').forEach(o=>o.disabled=true);
  const fb=document.getElementById('fb');speak(hangul);
  if(chosen===correct){el.classList.add('correct');recordWord(hangul,true);session.correct++;fb.className='feedback good show';fb.innerHTML=x.correct;setTimeout(()=>advance(),1100);}
  else{el.classList.add('wrong');document.querySelectorAll('.option').forEach(o=>{if(o.textContent===correct)o.classList.add('correct');});recordWord(hangul,false);fb.className='feedback bad show';fb.innerHTML=x.notQuite+' "<b>'+correct+'</b>"'+x.seeSoon;setTimeout(()=>advance(),1900);}
}

function recallStep(step){const w=step.word;const x=t();return '<div class="word-card" id="recall-card" onclick="flipRecall(\''+w.k+'\',\''+w.r+'\',\''+esc(m(w))+'\')"><button class="audio-btn" onclick="event.stopPropagation();speak(\''+w.k+'\')">🔊</button><div class="word-hangul small">'+w.k+'</div><div class="tap-hint">'+x.remember+'</div></div><div class="recall-row" id="recall-btns" style="display:none"><button class="btn btn-hard" onclick="recordWord(\''+w.k+'\',false);advance()">'+x.forgot+'</button><button class="btn btn-easy" onclick="recordWord(\''+w.k+'\',true);session.correct++;advance()">'+x.knewIt+'</button></div>';}

function flipRecall(k,r,e){const card=document.getElementById('recall-card');speak(k);card.innerHTML='<button class="audio-btn" onclick="event.stopPropagation();speak(\''+k+'\')">🔊</button><div class="word-hangul small">'+k+'</div><div class="word-roman">'+r+'</div><div class="word-english">'+e+'</div>';document.getElementById('recall-btns').style.display='flex';}

let sentenceState=null;
function sentenceStep(step){const s=step.sentence;const x=t();const allChips=[...s.korean,...s.extra].sort(()=>Math.random()-0.5);sentenceState={target:s.korean,placed:[]};return '<div class="sentence-english">'+x.build+': "<b>'+lt(s)+'</b>"</div><div class="sentence-target" id="sent-target"><span style="color:var(--muted);font-size:0.85rem">'+x.tapOrder+'</span></div><div class="chip-bank">'+allChips.map((c,i)=>'<button class="chip" id="chip-'+i+'" onclick="placeChip('+i+',\''+c+'\')">'+c+'</button>').join('')+'</div><button class="btn btn-primary btn-full" onclick="checkSentence()">'+x.checkAns+'</button><div class="feedback" id="sent-fb"></div>';}

function placeChip(i,word){const chip=document.getElementById('chip-'+i);if(chip.classList.contains('placed'))return;chip.classList.add('placed');sentenceState.placed.push({i:i,word:word});renderTarget();}
function renderTarget(){const x=t();const tg=document.getElementById('sent-target');if(sentenceState.placed.length===0){tg.innerHTML='<span style="color:var(--muted);font-size:0.85rem">'+x.tapOrder+'</span>';return;}tg.innerHTML=sentenceState.placed.map((p,idx)=>'<span class="slot" onclick="removeChip('+idx+')">'+p.word+'</span>').join('');}
function removeChip(idx){const p=sentenceState.placed[idx];document.getElementById('chip-'+p.i).classList.remove('placed');sentenceState.placed.splice(idx,1);renderTarget();}
function checkSentence(){const x=t();const built=sentenceState.placed.map(p=>p.word);const fb=document.getElementById('sent-fb');const correct=JSON.stringify(built)===JSON.stringify(sentenceState.target);speak(sentenceState.target.join(' '));if(correct){fb.className='feedback good show';fb.innerHTML=x.perfect;session.correct++;state.totalXP+=10;setTimeout(()=>advance(),1600);}else{fb.className='feedback bad show';fb.innerHTML=x.close+' <b>'+sentenceState.target.join(' ')+'</b>';setTimeout(()=>advance(),2400);}}

function recordWord(hangul,correct){if(!state.words[hangul])state.words[hangul]={seen:0,correct:0,box:0};const w=state.words[hangul];w.seen++;if(correct){w.correct++;w.box=Math.min(w.box+1,5);state.totalXP+=5;if(w.box===1&&!session.learnedThisSession.has(hangul)){session.learnedThisSession.add(hangul);state.todayCount++;}}else{w.box=Math.max(w.box-1,0);}saveAll();}
function advance(){session.idx++;renderStep();}

function renderComplete(){
  saveAll();const x=t();
  const wrap=document.getElementById('study-wrap');
  const learned=session.learnedThisSession.size;
  wrap.innerHTML='<div class="complete"><div class="complete-emoji">🎉</div><div class="complete-title">'+x.sessionDone+'</div><div style="color:var(--muted)">'+x.greatWork+' '+lt(session.lesson.title)+'</div><div class="complete-stats"><div class="cstat"><div class="cstat-num">'+session.correct+'</div><div class="cstat-label">'+x.correctLabel+'</div></div><div class="cstat"><div class="cstat-num">'+learned+'</div><div class="cstat-label">'+x.newWords+'</div></div><div class="cstat"><div class="cstat-num">🔥'+state.streak+'</div><div class="cstat-label">'+x.streakLabel+'</div></div></div><button class="btn btn-primary btn-full" onclick="startLesson(\''+session.lesson.id+'\')">'+x.studyAgain+'</button><button class="btn btn-hard btn-full" style="background:var(--surface);color:var(--text);border:1px solid var(--border)" onclick="nav(\'home\',document.querySelectorAll(\'.tab\')[0])">'+x.backHome+'</button></div>';
  showToast('🎉 +'+(session.correct*5)+' XP');
}

function renderProgress(){
  const x=t();
  const learned=Object.values(state.words).filter(w=>w.box>=1).length;
  const mastered=Object.values(state.words).filter(w=>w.box>=4).length;
  document.getElementById('ps-learned').textContent=learned;
  document.getElementById('ps-streak').textContent=state.streak;
  document.getElementById('ps-mastered').textContent=mastered;
  document.getElementById('ps-total').textContent=state.totalXP;
  const allWords=lessons.flatMap(l=>l.words);
  const seen=allWords.filter(w=>state.words[w.k]&&state.words[w.k].seen>0);
  const list=document.getElementById('word-list');
  if(seen.length===0){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:2rem">'+x.startLesson+'</div>';return;}
  list.innerHTML=seen.map(w=>{const box=state.words[w.k].box;const dots='●'.repeat(box)+'○'.repeat(5-box);return '<div class="wl-item"><div class="wl-hangul">'+w.k+'</div><div class="wl-mid"><div class="wl-eng">'+m(w)+'</div><div class="wl-rom">'+w.r+' · <span style="color:var(--gold)">'+dots+'</span></div></div><button class="wl-audio" onclick="speak(\''+w.k+'\')">🔊</button></div>';}).join('');
}

// ============ SMART REVIEW ============
function getWeakWords(){
  // all words that have been seen, sorted by weakest (lowest box) first, wrong-heavy prioritized
  const all=lessons.flatMap(l=>l.words);
  const seen=all.filter(w=>state.words[w.k]&&state.words[w.k].seen>0);
  // weak = box < 4 (not yet mastered)
  const weak=seen.filter(w=>state.words[w.k].box<4);
  weak.sort((a,b)=>{
    const wa=state.words[a.k],wb=state.words[b.k];
    if(wa.box!==wb.box)return wa.box-wb.box; // lower box first
    // then more wrong answers first
    const errA=wa.seen-wa.correct, errB=wb.seen-wb.correct;
    return errB-errA;
  });
  return weak;
}

function renderReviewHome(){
  document.getElementById('review-wrap').style.display='none';
  const home=document.getElementById('review-home');
  home.style.display='block';
  const x=t();
  const weak=getWeakWords();
  const seen=lessons.flatMap(l=>l.words).filter(w=>state.words[w.k]&&state.words[w.k].seen>0);

  let statusMsg, canStart=false;
  if(seen.length===0){statusMsg=x.reviewNone;}
  else if(weak.length===0){statusMsg=x.reviewMastered;}
  else{statusMsg=weak.length+' '+x.reviewReady;canStart=true;}

  home.innerHTML='<div class="section-title" style="margin-top:1.5rem">'+x.reviewTitle+'</div>'+
    '<div style="color:var(--muted);font-size:0.85rem;margin-bottom:1.2rem;line-height:1.5">'+x.reviewSub+'</div>'+
    '<div class="goal-card" style="flex-direction:column;align-items:flex-start;gap:1rem;margin-bottom:1.2rem">'+
      '<div style="display:flex;align-items:center;gap:1rem;width:100%">'+
        '<div style="font-size:2.5rem">🔄</div>'+
        '<div style="flex:1"><div style="font-weight:700;font-size:1.05rem;color:'+(canStart?'var(--gold)':'var(--muted)')+'">'+statusMsg+'</div></div>'+
      '</div>'+
      (canStart?'<button class="btn btn-primary btn-full" onclick="startReview()">'+x.reviewStart+'</button>':'')+
    '</div>';
}

let reviewSession=null;
function startReview(){
  const weak=getWeakWords().slice(0,12); // up to 12 per session
  reviewSession={words:weak,idx:0,correct:0,improved:new Set()};
  document.getElementById('review-home').style.display='none';
  document.getElementById('review-wrap').style.display='block';
  renderReviewStep();
}

function renderReviewStep(){
  const wrap=document.getElementById('review-wrap');
  const x=t();
  if(reviewSession.idx>=reviewSession.words.length){
    wrap.innerHTML='<div class="complete"><div class="complete-emoji">🎯</div><div class="complete-title">'+x.reviewDone+'</div><div class="complete-stats"><div class="cstat"><div class="cstat-num">'+reviewSession.correct+'/'+reviewSession.words.length+'</div><div class="cstat-label">'+x.correctLabel+'</div></div><div class="cstat"><div class="cstat-num">'+reviewSession.improved.size+'</div><div class="cstat-label">'+x.reviewImproved+'</div></div></div><button class="btn btn-primary btn-full" onclick="renderReviewHome()">'+x.backHome+'</button></div>';
    return;
  }
  const w=reviewSession.words[reviewSession.idx];
  const progress=Math.round(reviewSession.idx/reviewSession.words.length*100);
  // alternate between choose-meaning and recall
  const mode=reviewSession.idx%2===0?'choose':'recall';
  let top='<div class="study-top"><button class="study-back" onclick="renderReviewHome()">✕</button><div class="study-bar"><div class="study-bar-fill" style="width:'+progress+'%"></div></div><span class="study-count">'+(reviewSession.idx+1)+'/'+reviewSession.words.length+'</span></div>';
  let body;
  if(mode==='choose'){
    const allM=lessons.flatMap(l=>l.words.map(z=>m(z)));
    let opts=[m(w)];const others=allM.filter(e=>e!==m(w)).sort(()=>Math.random()-0.5);opts.push(...others.slice(0,3));opts=opts.sort(()=>Math.random()-0.5);
    body='<div class="word-card" style="min-height:160px"><button class="audio-btn" onclick="speak(\''+w.k+'\')">🔊</button><div class="word-hangul small">'+w.k+'</div><div class="word-roman">'+w.r+'</div></div><div style="text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:0.8rem">'+x.whatMeans+'</div><div class="options">'+opts.map(o=>'<button class="option" onclick="checkReview(this,\''+esc(o)+'\',\''+esc(m(w))+'\',\''+w.k+'\')">'+o+'</button>').join('')+'</div><div class="feedback" id="rfb"></div>';
  } else {
    body='<div class="word-card" id="rev-card" onclick="flipReview(\''+w.k+'\',\''+w.r+'\',\''+esc(m(w))+'\')"><button class="audio-btn" onclick="event.stopPropagation();speak(\''+w.k+'\')">🔊</button><div class="word-hangul small">'+w.k+'</div><div class="tap-hint">'+x.remember+'</div></div><div class="recall-row" id="rev-btns" style="display:none"><button class="btn btn-hard" onclick="gradeReview(false,\''+w.k+'\')">'+x.forgot+'</button><button class="btn btn-easy" onclick="gradeReview(true,\''+w.k+'\')">'+x.knewIt+'</button></div>';
  }
  wrap.innerHTML=top+body;
  setTimeout(()=>speak(w.k),350);
}

function checkReview(el,chosen,correct,hangul){
  const x=t();
  document.querySelectorAll('#review-wrap .option').forEach(o=>o.disabled=true);
  const fb=document.getElementById('rfb');speak(hangul);
  const right=chosen===correct;
  if(right){el.classList.add('correct');fb.className='feedback good show';fb.innerHTML=x.correct;}
  else{el.classList.add('wrong');document.querySelectorAll('#review-wrap .option').forEach(o=>{if(o.textContent===correct)o.classList.add('correct');});fb.className='feedback bad show';fb.innerHTML=x.notQuite+' "<b>'+correct+'</b>"';}
  applyReviewResult(right,hangul);
  setTimeout(()=>{reviewSession.idx++;renderReviewStep();},right?1100:1800);
}

function flipReview(k,r,e){const card=document.getElementById('rev-card');speak(k);card.innerHTML='<button class="audio-btn" onclick="event.stopPropagation();speak(\''+k+'\')">🔊</button><div class="word-hangul small">'+k+'</div><div class="word-roman">'+r+'</div><div class="word-english">'+e+'</div>';document.getElementById('rev-btns').style.display='flex';}

function gradeReview(right,hangul){
  applyReviewResult(right,hangul);
  reviewSession.idx++;renderReviewStep();
}

function applyReviewResult(right,hangul){
  if(!state.words[hangul])state.words[hangul]={seen:0,correct:0,box:0};
  const w=state.words[hangul];w.seen++;
  if(right){w.correct++;w.box=Math.min(w.box+1,5);state.totalXP+=5;reviewSession.correct++;reviewSession.improved.add(hangul);}
  else{w.box=Math.max(w.box-1,0);}
  saveAll();
}

function nav(page,el,fromCode){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+page).classList.add('active');if(!fromCode){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');}if(page==='home')renderHome();if(page==='progress')renderProgress();if(page==='review')renderReviewHome();window.scrollTo(0,0);}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600);}

// INIT
['en','ru','uz'].forEach(l=>document.getElementById('lang-'+l).classList.toggle('active',l===LANG));
applyUI();
renderHome();
</script>
