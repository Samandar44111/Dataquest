<title>DataQuest Academy · Learn Data Science From Zero</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #080c14;
  --bg2: #0d1220;
  --bg3: #111827;
  --cyan: #00e5ff;
  --cyan2: #00b8d4;
  --green: #00ff88;
  --orange: #ff6b35;
  --purple: #a855f7;
  --yellow: #ffd600;
  --red: #ff4444;
  --text: #e2e8f0;
  --muted: #64748b;
  --border: rgba(0,229,255,0.12);
  --card: rgba(13,18,32,0.9);
  --code-bg: #0a0e16;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(8,12,20,0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.2rem;
  height: 56px;
}

.logo {
  font-family: 'Orbitron', monospace;
  font-size: 0.95rem;
  font-weight: 900;
  color: var(--cyan);
  letter-spacing: 0.05em;
  text-shadow: 0 0 20px rgba(0,229,255,0.5);
  cursor: pointer;
}
.logo span { color: var(--green); }

.progress-mini {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--yellow);
  background: rgba(255,214,0,0.1);
  border: 1px solid rgba(255,214,0,0.3);
  padding: 0.25rem 0.6rem;
  border-radius: 20px;
}

main {
  padding-top: 56px;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ===== CURRICULUM (HOME) ===== */
.hero {
  padding: 2.5rem 1.2rem 1.5rem;
  text-align: center;
  max-width: 700px;
  margin: 0 auto;
}

.hero-badge {
  display: inline-block;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--green);
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.25);
  padding: 0.3rem 0.8rem;
  border-radius: 20px;
  margin-bottom: 1.2rem;
}

.hero h1 {
  font-family: 'Orbitron', monospace;
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 40px rgba(0,229,255,0.3);
  line-height: 1.1;
  margin-bottom: 0.8rem;
}

.hero p {
  font-size: 0.95rem;
  color: var(--muted);
}

.overall-progress {
  max-width: 700px;
  margin: 1.5rem auto;
  padding: 0 1.2rem;
}

.op-bar {
  height: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 5px;
  overflow: hidden;
}
.op-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  border-radius: 5px;
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 10px rgba(0,229,255,0.5);
}
.op-text {
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--muted);
  margin-top: 0.5rem;
}

.modules {
  max-width: 700px;
  margin: 0 auto;
  padding: 1rem 1.2rem 3rem;
}

.module {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--mod-color, var(--cyan));
  border-radius: 0 10px 10px 0;
  margin-bottom: 1rem;
  overflow: hidden;
}

.module-head {
  padding: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: background 0.2s;
}
.module-head:hover { background: rgba(255,255,255,0.02); }

.mod-icon {
  font-size: 1.6rem;
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: var(--mod-bg, rgba(0,229,255,0.1));
  border-radius: 10px;
  flex-shrink: 0;
}

.mod-info { flex: 1; min-width: 0; }
.mod-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: var(--mod-color, var(--cyan));
  text-transform: uppercase;
}
.mod-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.9rem;
  color: var(--text);
  margin: 0.2rem 0;
}
.mod-meta {
  font-size: 0.7rem;
  color: var(--muted);
}

.mod-arrow {
  color: var(--muted);
  font-size: 1.2rem;
  transition: transform 0.3s;
}
.module.open .mod-arrow { transform: rotate(90deg); }

.mod-lessons {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.module.open .mod-lessons { max-height: 1000px; }

.lesson-item {
  padding: 0.8rem 1.2rem 0.8rem 4.5rem;
  border-top: 1px solid rgba(255,255,255,0.04);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.7rem;
  transition: all 0.2s;
}
.lesson-item:hover { background: rgba(0,229,255,0.04); padding-left: 4.8rem; }

.lesson-check {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--muted);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem;
  transition: all 0.2s;
}
.lesson-item.done .lesson-check {
  background: var(--green);
  border-color: var(--green);
  color: var(--bg);
}
.lesson-name { flex: 1; font-size: 0.85rem; }
.lesson-item.done .lesson-name { color: var(--muted); }
.lesson-go { color: var(--cyan); font-size: 0.7rem; opacity: 0; transition: opacity 0.2s; }
.lesson-item:hover .lesson-go { opacity: 1; }

/* ===== LESSON VIEW ===== */
.lesson-view {
  max-width: 720px;
  margin: 0 auto;
  padding: 1.5rem 1.2rem 4rem;
}

.lesson-back {
  background: none;
  border: 1px solid var(--border);
  color: var(--cyan);
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 1.5rem;
  transition: all 0.2s;
}
.lesson-back:hover { background: rgba(0,229,255,0.08); }

.lesson-tag {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--lesson-color, var(--cyan));
  background: rgba(0,229,255,0.08);
  border: 1px solid var(--lesson-color, rgba(0,229,255,0.2));
  padding: 0.25rem 0.7rem;
  border-radius: 20px;
  margin-bottom: 1rem;
}

.lesson-view h1 {
  font-family: 'Orbitron', monospace;
  font-size: 1.5rem;
  color: var(--lesson-color, var(--cyan));
  line-height: 1.2;
  margin-bottom: 1.5rem;
  text-shadow: 0 0 30px rgba(0,229,255,0.2);
}

.lesson-content h2 {
  font-family: 'Orbitron', monospace;
  font-size: 1rem;
  color: var(--text);
  margin: 2rem 0 0.8rem;
  padding-left: 0.8rem;
  border-left: 3px solid var(--lesson-color, var(--cyan));
}

.lesson-content h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--green);
  margin: 1.5rem 0 0.5rem;
}

.lesson-content p {
  font-size: 0.95rem;
  color: #cbd5e1;
  margin-bottom: 1rem;
}

.lesson-content ul, .lesson-content ol {
  margin: 0 0 1rem 1.2rem;
  color: #cbd5e1;
  font-size: 0.92rem;
}
.lesson-content li { margin-bottom: 0.5rem; }

.lesson-content strong { color: var(--cyan); font-weight: 700; }
.lesson-content em { color: var(--yellow); font-style: normal; }

.callout {
  background: rgba(0,255,136,0.06);
  border: 1px solid rgba(0,255,136,0.2);
  border-radius: 8px;
  padding: 1rem 1.2rem;
  margin: 1.2rem 0;
  font-size: 0.9rem;
}
.callout-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--green);
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
}

.callout.tip { background: rgba(255,214,0,0.06); border-color: rgba(255,214,0,0.2); }
.callout.tip .callout-title { color: var(--yellow); }
.callout.game { background: rgba(168,85,247,0.06); border-color: rgba(168,85,247,0.2); }
.callout.game .callout-title { color: var(--purple); }

pre {
  background: var(--code-bg);
  border: 1px solid rgba(0,229,255,0.15);
  border-radius: 8px;
  padding: 1rem;
  overflow-x: auto;
  margin: 1rem 0;
  position: relative;
}
pre code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: #a5f3fc;
  line-height: 1.6;
}
.code-label {
  position: absolute;
  top: 0; right: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  color: var(--muted);
  background: rgba(0,229,255,0.1);
  padding: 0.2rem 0.6rem;
  border-radius: 0 8px 0 8px;
  text-transform: uppercase;
}
code.inline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  background: rgba(0,229,255,0.1);
  color: var(--cyan);
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
}

.cmt { color: #4ade80; }
.kw { color: #c084fc; }
.str { color: #fbbf24; }
.fn { color: #38bdf8; }

.lesson-nav {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 2.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
}

.btn {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.7rem 1.3rem;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--cyan), var(--cyan2));
  color: var(--bg);
  box-shadow: 0 0 20px rgba(0,229,255,0.25);
}
.btn-primary:hover { box-shadow: 0 0 30px rgba(0,229,255,0.4); transform: translateY(-1px); }
.btn-done {
  background: linear-gradient(135deg, var(--green), #00cc6a);
  color: var(--bg);
  width: 100%;
  margin-top: 1.5rem;
  padding: 0.9rem;
  font-size: 0.9rem;
}
.btn-done.completed { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid var(--green); }
.btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); }
.btn-secondary:hover { background: rgba(255,255,255,0.08); }
.btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translate(-50%, 100px);
  background: var(--bg3);
  border: 1px solid var(--green);
  border-radius: 8px;
  padding: 0.8rem 1.4rem;
  font-size: 0.85rem;
  color: var(--green);
  z-index: 999;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  font-family: 'JetBrains Mono', monospace;
  box-shadow: 0 0 20px rgba(0,255,136,0.2);
  white-space: nowrap;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 3px; }
</style>
</head>

</main>

<script>
// ===== LESSON CONTENT =====
const curriculum = [
  {
    title: "What is Data Science?",
    icon: "🌟", color: "#00e5ff", bg: "rgba(0,229,255,0.1)",
    desc: "Start here — understand the field before anything else",
    lessons: [
      {
        title: "What Even Is a Data Scientist?",
        body: `
<p>Let's start with the simplest possible explanation. A <strong>data scientist</strong> is someone who looks at large amounts of information (data) and finds useful answers hidden inside it.</p>
<p>Think about a game like Mobile Legends. Every time millions of players tap, buy a skin, win, or quit — that creates <em>data</em>. A data scientist's job is to study that data and answer questions like:</p>
<ul>
<li>Why do players quit after level 10?</li>
<li>Which heroes make players spend money?</li>
<li>What time of day do most people play?</li>
</ul>
<h2>The Simple Definition</h2>
<p>A data scientist turns <strong>raw data</strong> into <strong>decisions</strong>. That's the whole job in one sentence.</p>
<div class="callout">
<div class="callout-title">🎯 REAL EXAMPLE</div>
A game company notices players quit a lot. The data scientist studies the data and discovers level 7 is way too hard. The company makes it easier — and player retention jumps 20%. That decision was worth millions. <strong>That's the power of data science.</strong>
</div>
<h2>What Makes It Different From Other Jobs?</h2>
<p>A regular analyst might make a chart. A data scientist goes further — they <strong>predict the future</strong> using math and code. For example, predicting <em>which</em> players are about to quit <em>before</em> they actually do.</p>
<div class="callout game">
<div class="callout-title">🎮 YOUR ADVANTAGE</div>
Because you love games, you already understand player behavior from the inside. That intuition is something most data scientists don't have — it's your secret weapon for game analytics.
</div>`
      },
      {
        title: "What Does a Data Scientist Do All Day?",
        body: `
<p>People imagine data scientists doing complex AI all day. The reality is more down-to-earth. Here's how the time actually splits:</p>
<h2>The Real Breakdown</h2>
<ul>
<li><strong>~60% Cleaning data</strong> — Real data is messy. Missing values, typos, duplicates. Most of the job is fixing this before any analysis.</li>
<li><strong>~20% Exploring & analyzing</strong> — Making charts, finding patterns, asking questions.</li>
<li><strong>~10% Building models</strong> — The "machine learning" part everyone talks about.</li>
<li><strong>~10% Communicating</strong> — Explaining findings to bosses who don't know code.</li>
</ul>
<div class="callout tip">
<div class="callout-title">💡 HONEST TRUTH</div>
The "boring" 60% (cleaning data) is where beginners give up. But it's also where you build real skill. Push through it — everyone struggles here at first.
</div>
<h2>A Typical Task</h2>
<p>Imagine your boss asks: <em>"Are players who use voice chat more likely to keep playing?"</em></p>
<ol>
<li>You pull the data (who used voice chat, who kept playing)</li>
<li>You clean it (remove broken records)</li>
<li>You analyze it (compare the two groups)</li>
<li>You answer: "Yes, voice chat users stay 3x longer"</li>
<li>The company invests more in voice features</li>
</ol>
<p>That's a full data science cycle. Simple, powerful, valuable.</p>`
      },
      {
        title: "The Skills You'll Need (Roadmap Overview)",
        body: `
<p>Here's everything you'll learn in this academy, in order. Don't worry — we teach each one step by step.</p>
<h2>The 4 Core Skills</h2>
<h3>1. Python 🐍</h3>
<p>A programming language that's easy to read. It's how you tell the computer what to do with data. <strong>The most important tool.</strong></p>
<h3>2. Statistics 📊</h3>
<p>The math of understanding data — averages, patterns, probability. Don't panic, we keep it practical.</p>
<h3>3. SQL 🗄️</h3>
<p>The language for pulling data out of databases. Almost every company stores data in databases, so this is essential.</p>
<h3>4. Machine Learning 🤖</h3>
<p>Teaching computers to make predictions. This is the advanced, exciting part — and we build up to it slowly.</p>
<div class="callout">
<div class="callout-title">🗺️ YOUR PATH</div>
Foundations → Python → Statistics → SQL → Machine Learning → Game Analytics → Job Ready. Each module builds on the last. Just go one lesson at a time.
</div>
<div class="callout tip">
<div class="callout-title">💡 DON'T RUSH</div>
You can't learn all of this in a week, and that's okay. Consistency beats speed. One lesson a day for a few months will take you further than cramming.
</div>`
      }
    ]
  },
  {
    title: "Python Basics",
    icon: "🐍", color: "#00ff88", bg: "rgba(0,255,136,0.1)",
    desc: "The #1 tool of every data scientist",
    lessons: [
      {
        title: "Why Python? And Your First Code",
        body: `
<p><strong>Python</strong> is a programming language. A language is just a way to give instructions to a computer. Python is famous for being <em>readable</em> — it almost looks like English.</p>
<h2>Why Data Scientists Love Python</h2>
<ul>
<li>Easy to learn (great for beginners like you)</li>
<li>Huge collection of free tools for data</li>
<li>Used by Google, Netflix, every game studio</li>
</ul>
<h2>Your Very First Code</h2>
<p>This line tells the computer to display a message:</p>
<pre><span class="code-label">Python</span><code><span class="fn">print</span>(<span class="str">"Hello, I'm learning data science!"</span>)</code></pre>
<p>When you run that, the computer shows:</p>
<pre><code>Hello, I'm learning data science!</code></pre>
<p>That's it. <code class="inline">print()</code> means "show this on screen." The text inside the quotes is what gets shown.</p>
<div class="callout tip">
<div class="callout-title">💡 WHERE TO PRACTICE</div>
You don't need to install anything yet. Go to <strong>replit.com</strong> or <strong>Google Colab</strong> — both let you write and run Python in your browser, even on your phone.
</div>`
      },
      {
        title: "Variables — Storing Information",
        body: `
<p>A <strong>variable</strong> is like a labeled box where you store a piece of information so you can use it later.</p>
<h2>Creating Variables</h2>
<pre><span class="code-label">Python</span><code><span class="cmt"># Storing a player's info</span>
player_name = <span class="str">"Samandar"</span>
player_level = <span class="kw">42</span>
is_online = <span class="kw">True</span></code></pre>
<p>Now you can use them anywhere:</p>
<pre><span class="code-label">Python</span><code><span class="fn">print</span>(player_name)   <span class="cmt"># shows: Samandar</span>
<span class="fn">print</span>(player_level)  <span class="cmt"># shows: 42</span></code></pre>
<h2>The 3 Main Types You'll Use</h2>
<ul>
<li><strong>Text (string)</strong> — words, always in quotes: <code class="inline">"Mobile Legends"</code></li>
<li><strong>Number (int/float)</strong> — like <code class="inline">42</code> or <code class="inline">9.99</code></li>
<li><strong>True/False (boolean)</strong> — yes or no values: <code class="inline">True</code></li>
</ul>
<div class="callout game">
<div class="callout-title">🎮 GAME EXAMPLE</div>
A game stores every player as variables: their name, level, coins, wins. When you analyze game data, you're working with millions of these stored values.
</div>`
      },
      {
        title: "Lists & Loops — Handling Lots of Data",
        body: `
<p>Data science means dealing with <em>thousands</em> of values, not just one. That's where <strong>lists</strong> and <strong>loops</strong> come in.</p>
<h2>Lists — Many Values in One Box</h2>
<pre><span class="code-label">Python</span><code><span class="cmt"># Scores from 5 matches</span>
scores = [<span class="kw">12</span>, <span class="kw">8</span>, <span class="kw">15</span>, <span class="kw">20</span>, <span class="kw">5</span>]</code></pre>
<h2>Loops — Doing Something to Each Item</h2>
<p>A <strong>loop</strong> repeats an action for every item. Instead of writing code 5 times, you write it once:</p>
<pre><span class="code-label">Python</span><code><span class="kw">for</span> score <span class="kw">in</span> scores:
    <span class="fn">print</span>(score)

<span class="cmt"># shows each score: 12, 8, 15, 20, 5</span></code></pre>
<h2>A Useful Real Example</h2>

// ===== STATE =====
let done = new Set(JSON.parse(localStorage.getItem('dq_lessons_done') || '[]'));
let currentMod = 0, currentLes = 0;

// Build flat lesson index for navigation
let flatLessons = [];
curriculum.forEach((m, mi) => m.lessons.forEach((l, li) => flatLessons.push({mi, li})));

function totalLessons() { return flatLessons.length; }
function lessonKey(mi, li) { return `${mi}-${li}`; }

// ===== RENDER HOME =====
function renderHome() {
  const container = document.getElementById('modules-container');
  container.innerHTML = curriculum.map((mod, mi) => {
    const doneCount = mod.lessons.filter((_, li) => done.has(lessonKey(mi, li))).length;
    const lessons = mod.lessons.map((les, li) => {
      const isDone = done.has(lessonKey(mi, li));
      return `<div class="lesson-item ${isDone ? 'done' : ''}" onclick="openLesson(${mi}, ${li})">
        <div class="lesson-check">${isDone ? '✓' : ''}</div>
        <div class="lesson-name">${les.title}</div>
        <div class="lesson-go">READ →</div>
      </div>`;
    }).join('');

    return `<div class="module" style="--mod-color:${mod.color};--mod-bg:${mod.bg}" id="mod-${mi}">
      <div class="module-head" onclick="toggleModule(${mi})">
        <div class="mod-icon" style="background:${mod.bg}">${mod.icon}</div>
        <div class="mod-info">
          <div class="mod-num">Module ${mi+1}</div>
          <div class="mod-title">${mod.title}</div>
          <div class="mod-meta">${mod.desc} · ${doneCount}/${mod.lessons.length} done</div>
        </div>
        <div class="mod-arrow">›</div>
      </div>
      <div class="mod-lessons">${lessons}</div>
    </div>`;
  }).join('');
  updateProgress();
}

function toggleModule(mi) {
  document.getElementById('mod-' + mi).classList.toggle('open');
}

function updateProgress() {
  const total = totalLessons();
  const pct = total ? Math.round((done.size / total) * 100) : 0;
  document.getElementById('op-fill').style.width = pct + '%';
  document.getElementById('op-text').textContent = `${done.size} of ${total} lessons complete`;
  document.getElementById('progress-mini').textContent = pct + '%';
}

// ===== OPEN LESSON =====
function openLesson(mi, li) {
  currentMod = mi; currentLes = li;
  const mod = curriculum[mi];
  const les = mod.lessons[li];
  const isDone = done.has(lessonKey(mi, li));

  // navigation
  const flatIdx = flatLessons.findIndex(f => f.mi === mi && f.li === li);
  const prev = flatIdx > 0 ? flatLessons[flatIdx - 1] : null;
  const next = flatIdx < flatLessons.length - 1 ? flatLessons[flatIdx + 1] : null;

  document.getElementById('lesson-view').innerHTML = `
    <button class="lesson-back" onclick="goHome()">← Back to Lessons</button>
    <div class="lesson-tag" style="--lesson-color:${mod.color}">${mod.icon} ${mod.title}</div>
    <h1 style="--lesson-color:${mod.color}">${les.title}</h1>
    <div class="lesson-content" style="--lesson-color:${mod.color}">${les.body}</div>
    <button class="btn btn-done ${isDone ? 'completed' : ''}" id="done-btn" onclick="markDone(${mi}, ${li})">
      ${isDone ? '✓ Completed — Tap to undo' : 'Mark Lesson Complete ✓'}
    </button>
    <div class="lesson-nav">
      <button class="btn btn-secondary" ${prev ? `onclick="openLesson(${prev.mi}, ${prev.li})"` : 'disabled'}>← Prev</button>
      <button class="btn btn-primary" ${next ? `onclick="openLesson(${next.mi}, ${next.li})"` : 'onclick="goHome()"'}>${next ? 'Next →' : 'Finish 🎉'}</button>
    </div>`;

  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-lesson').classList.add('active');
  window.scrollTo(0, 0);
}

function markDone(mi, li) {
  const key = lessonKey(mi, li);
  const btn = document.getElementById('done-btn');
  if (done.has(key)) {
    done.delete(key);
    btn.classList.remove('completed');
    btn.textContent = 'Mark Lesson Complete ✓';
  } else {
    done.add(key);
    btn.classList.add('completed');
    btn.textContent = '✓ Completed — Tap to undo';
    showToast('Lesson complete! Keep going 🚀');
  }
  localStorage.setItem('dq_lessons_done', JSON.stringify([...done]));
  updateProgress();
}

function goHome() {
  document.getElementById('view-lesson').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  renderHome();
  window.scrollTo(0, 0);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// INIT
renderHome();
// Auto-open first module
setTimeout(() => document.getElementById('mod-0').classList.add('open'), 300);
</script>
